name: pulso_app
description: PULSO — treino com ritmo. App de academia em Flutter.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Gerenciamento de estado
  flutter_riverpod: ^2.5.1

  # Navegação
  go_router: ^14.2.0

  # Design System
  google_fonts: ^6.2.1

  # HTTP
  http: ^1.2.1

  # Internacionalização
  intl: 0.20.2

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1

  # Login Google
  google_sign_in: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/animations/
    - assets/lottie/
    - assets/exercises/
    - assets/data/